---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadbalancer-service-smoke
  labels:
    app.kubernetes.io/name: loadbalancer-service-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadbalancer-service-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadbalancer-service-smoke
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-service-smoke
  labels:
    app.kubernetes.io/name: loadbalancer-service-smoke
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: loadbalancer-service-smoke
  ports:
    - name: http
      port: 8081
      targetPort: 80
