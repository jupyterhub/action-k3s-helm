---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-smoke
    spec:
      containers:
        - name: nginx
          image: docker.io/nginx:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-smoke
spec:
  selector:
    app.kubernetes.io/name: gateway-smoke
  ports:
    - port: 80
      targetPort: http
